interface:
  display_name: "Plan"
  short_description: "Turn rough requests into execution plans with explicit unknowns"
  default_prompt: "Use $ywc-plan to clarify this change request, assess scale, surface unresolved assumptions explicitly, and route it to the right specification, task, or implementation path. For fresh Medium/Large specs, run ywc-spec-ready once by default; suppress it with --no-converge or --non-interactive. For agentic-owned output, use --no-converge --artifact-profile agentic and consume only its validated Result block."
