interface:
  display_name: "Task Generator"
  short_description: "Decompose specs into executable tasks in ko/ja/en/zh/es"
  default_prompt: "Use $ywc-task-generator to convert this approved specification into dependency-safe implementation task folders. Output task document prose in the requested language: ko, ja, en, es, or zh, use the requested --mode human or --mode llm, and honor preview approval flags such as --spec, --preview-only, --preview-path, and --approve-preview when supplied."
