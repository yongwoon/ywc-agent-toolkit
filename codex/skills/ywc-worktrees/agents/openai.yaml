  short_description: "Manage git worktree lifecycle for task isolation"
  default_prompt: "Use $ywc-worktrees to resolve, create, audit, or prune git worktrees for isolated task workspaces, respecting the project root; create from one concrete base or --existing-branch, distinguish exact-ref/transport/checked-out/dirty/locked outcomes, and preserve unsafe work before proceeding."
