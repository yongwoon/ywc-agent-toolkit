interface:
  display_name: "Debug Root Cause"
  short_description: "Investigate defects before proposing fixes"
  default_prompt: "Use $ywc-debug-rootcause to investigate a bug, test failure, build failure, or unexpected behavior through a four-phase root-cause workflow before applying any fix; use Caller: ywc-debug-rootcause and analysis_mode=debug_hypotheses for analyst advice, with 3–5 falsifiable candidates and the bounded fourth-fix gate."
