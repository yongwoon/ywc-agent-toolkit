name: HOL Plugin Scanner

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: HOL Plugin Scanner
        uses: hashgraph-online/ai-plugin-scanner-action@d22a55ba3fb23749c159982f2b6b452cf07b55ce # v1.2.572
        with:
          plugin_dir: "plugins/ywc-agent-toolkit"
          mode: scan
          min_score: 80
          fail_on_severity: high
          format: sarif
          upload_sarif: true
          trust_repository_policy: "true"
